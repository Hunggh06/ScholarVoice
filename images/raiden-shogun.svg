  <path d="M128 100 L115 160 L100 120" stroke="#5A2D9E" stroke-width="1" fill="none"/>
  <!-- Arms -->
  <path d="M72 105 Q55 150 50 200" stroke="#FDEBD3" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M128 105 Q145 150 150 200" stroke="#FDEBD3" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Obi/Belt -->
  <rect x="68" y="150" width="64" height="12" rx="3" fill="#D4AF37"/>
  <circle cx="100" cy="156" r="5" fill="#FFD700"/>
  <!-- Hair ornament -->
  <circle cx="100" cy="18" r="8" fill="#D4AF37"/>
  <path d="M92 18 L100 8 L108 18" fill="#FFD700"/>
