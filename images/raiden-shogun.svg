<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B3FA0"/>
      <stop offset="100%" stop-color="#4A1A7A"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7B4FBF"/>
      <stop offset="100%" stop-color="#5A2D9E"/>
    </linearGradient>
  </defs>
  <!-- Hair -->
  <ellipse cx="100" cy="55" rx="45" ry="50" fill="url(#hair)"/>
  <rect x="55" y="55" width="90" height="70" fill="url(#hair)"/>
  <!-- Face -->
  <ellipse cx="100" cy="70" rx="28" ry="32" fill="#FDEBD3"/>
  <!-- Eyes -->
  <ellipse cx="88" cy="65" rx="5" ry="6" fill="#4A1A7A"/>
  <ellipse cx="112" cy="65" rx="5" ry="6" fill="#4A1A7A"/>
  <circle cx="89" cy="63" r="2" fill="white"/>
  <circle cx="113" cy="63" r="2" fill="white"/>
  <!-- Mouth -->
  <path d="M94 78 Q100 83 106 78" stroke="#C97A7A" stroke-width="1.5" fill="none"/>
  <!-- Body/Dress -->
  <path d="M72 100 L60 260 L140 260 L128 100 Z" fill="url(#dress)"/>
