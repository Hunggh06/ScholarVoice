# Render deployment config for ScholarVoice
# Free Web Service tier with DeepSeek free API integration.
# Docs: https://render.com/docs/deploy-python

services:
  - type: web
    name: scholarvoice
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    healthCheckPath: "/"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10"
      # DeepSeek session — paste session.json content.
      # Get it by running locally: python -m deepseek.auth
      # Then copy the content of session/session.json here.
      # Session auto-refreshes ~6h if Chromium profile present.
      - key: DEEPSEEK_SESSION
        sync: false
